[project]
name = "multimodal-graph-rag"
version = "0.1.0"
description = "Local multimodal Graph RAG over COCO images: VLM extraction, Neo4j + ChromaDB, routing, cited answers, measured against COCO ground truth."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "neo4j>=5.20", "chromadb>=0.5", "gradio>=4.40"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmgraphrag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
