name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Offline tests only: no Neo4j, no Ollama on the runner.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install uv && uv pip install --system -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
